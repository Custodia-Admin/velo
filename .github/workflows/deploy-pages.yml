name: Deploy (Cloudflare Pages)

# The public site (DEPLOY.md): a version tag builds the public configuration
# (no env file, no token, neutral labels) and uploads it to Cloudflare Pages,
# then rides it. Run by hand from the Actions tab to redeploy a tag or branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  # A fork deploying its own site sets the repository variable CF_PAGES_PROJECT.
  PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'velo-trainer' }}
  PAGES_URL: https://${{ vars.CF_PAGES_PROJECT || 'velo-trainer' }}.pages.dev

jobs:
  deploy:
    if: github.repository == 'Custodia-Admin/velo' || vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cloudflare credentials are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID repository secrets (DEPLOY.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same gate as CI on main, so a tag on an unchecked commit can't ship.
      - run: node tools/worldbake/fetchPublished.mjs
      - run: npm run check
        env:
          VELO_REQUIRE_REMOTE_WORLDS: '1'
      - run: npm run build
      - run: node scripts/check-bundle-budget.mjs
      # Refuses a household or token-carrying build; writes dist/_headers.
      - run: node scripts/pages-dist.mjs
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.160.1 pages deploy dist
          --project-name "$PAGES_PROJECT" --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_REF_NAME"
      - name: The site serves this build
        run: |
          want=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          for i in $(seq 1 30); do
            got=$(curl -fsS "$PAGES_URL/app" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            [ "$got" = "$want" ] && { echo "$PAGES_URL serves $got"; exit 0; }
            sleep 10
          done
          echo "::error::$PAGES_URL serves '$got', expected '$want'"; exit 1
      - run: npx playwright install chromium
      - run: timeout 300 npx playwright install-deps chromium || echo "::warning::playwright install-deps failed (Ubuntu apt mirrors unreachable?); using the runner image's libraries"
      # The live site in a fresh browser: Perugia token-free, and Chengdu
      # downloaded from the bucket, then ridden again offline.
      - name: Ride the live site
        env:
          VELO_BASE_URL: ${{ env.PAGES_URL }}
        run: npx playwright test e2e/smoke-ride.spec.ts e2e/remote-world.spec.ts --project=chromium --grep "token-free smoke ride|chengdu-luxelakes"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-deploy-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
