<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Velo spike — synthetic GPU scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Stand-in for a future GPU-heavy world renderer: raymarched fBm terrain flown over at constant
// speed (full-frame motion, so the encoder sees worst-case content). ?steps= scales GPU cost.
const qs = new URLSearchParams(location.search);
const STEPS = +(qs.get('steps') || 160);
const c = document.getElementById('c');
const gl = c.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `#version 300 es
precision highp float; uniform vec2 R; uniform float T; out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<7;i++){ s+=a*n(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
float H(vec2 p){ return 3.2*fbm(p*.18) - 1.2; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*R)/R.y;
  vec3 ro = vec3(T*1.6, 2.6 + .4*sin(T*.3), T*1.1);
  vec3 ta = ro + vec3(1., -.35, .7);
  vec3 f = normalize(ta-ro), r = normalize(cross(vec3(0,1,0), f)), u = cross(f, r);
  vec3 rd = normalize(f + uv.x*r + uv.y*u);
  float t = .1; bool hit = false;
  for(int i=0;i<${STEPS};i++){ vec3 p = ro+rd*t; float d = p.y - H(p.xz); if(d<.002*t){hit=true;break;} t += .45*d; if(t>60.) break; }
  vec3 sky = mix(vec3(.55,.7,.9), vec3(.2,.35,.65), clamp(rd.y*2.,0.,1.));
  vec3 col = sky;
  if(hit){ vec3 p = ro+rd*t; vec2 e = vec2(.02,0.);
    vec3 nn = normalize(vec3(H(p.xz-e.xy)-H(p.xz+e.xy), 2.*e.x, H(p.xz-e.yx)-H(p.xz+e.yx)));
    float dif = clamp(dot(nn, normalize(vec3(.6,.7,.3))), 0., 1.);
    vec3 base = mix(vec3(.25,.4,.15), vec3(.5,.45,.4), smoothstep(.3,1.2,p.y)) * (.6+.4*fbm(p.xz*3.));
    col = mix(base*(.25+.9*dif), sky, 1.-exp(-.0025*t*t)); }
  o = vec4(pow(col, vec3(.4545)), 1.);
}`;
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T');
const frame = (ms) => {
  const w = innerWidth * devicePixelRatio, h = innerHeight * devicePixelRatio;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; gl.viewport(0, 0, w, h); }
  gl.uniform2f(uR, w, h); gl.uniform1f(uT, ms / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
// ?agent=1: load the render agent (marker + relay) without CDP, for demo-up.sh
if (qs.get('agent') === '1') { const sc = document.createElement('script'); sc.src = 'render-agent.js'; window.__veloRenderOpts = `relay=ws://${location.host}/ws&room=${qs.get('room') || 'a'}&worldOnly=0`; document.body.appendChild(sc); }
</script>
</body>
</html>
